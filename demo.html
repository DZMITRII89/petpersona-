<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetPersona — демо: карточка твоего питомца</title>
<style>
  :root {
    --accent: #c9738a;
    --accent-light: #e3a6b6;
    --ink: #2a2632;
    --ink-soft: #55505f;
    --paper: #cfcbcb;
    --paper-alt: #c2bcbd;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
    background-color: var(--paper);
    background-repeat: repeat;
    color: var(--ink);
    min-height: 100vh;
  }

  h1, h2 {
    font-family: Georgia, "Palatino Linotype", "Book Antiqua", serif;
    color: var(--ink);
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .back-link {
    display: inline-block;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.95rem;
    margin-bottom: 20px;
  }

  .back-link:hover { color: var(--accent); }

  header.top {
    text-align: center;
    margin-bottom: 32px;
  }

  header.top h1 {
    font-size: 2rem;
    margin: 0 0 8px;
  }

  header.top p {
    color: var(--ink-soft);
    margin: 0;
  }

  .panel {
    background: var(--paper-alt);
    border-radius: 16px;
    padding: 28px;
  }

  .style-panel { margin-bottom: 20px; }

  .style-group { margin-bottom: 18px; }
  .style-group:last-child { margin-bottom: 0; }

  .swatch-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .swatch, .pattern-swatch {
    border: 3px solid transparent;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1rem;
  }

  .pattern-swatch {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background-color: #e9e6e6;
    background-size: 28px 28px;
    font-size: 1.3rem;
  }

  .swatch.selected, .pattern-swatch.selected {
    border-color: var(--ink);
  }

  .swatch-auto {
    background: conic-gradient(from 180deg, #c9738a, #4a9d95, #d99a3d, #6c6bb0, #5f8a5a, #c9738a);
  }

  .pattern-swatch-auto {
    background: linear-gradient(135deg, #c9738a, #4a9d95);
  }

  label {
    display: block;
    font-weight: 600;
    margin: 18px 0 6px;
  }

  label:first-of-type { margin-top: 0; }

  input[type="text"],
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ink-soft);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }

  textarea { resize: vertical; min-height: 60px; }

  .fact-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    align-items: center;
  }

  .fact-row input { flex: 1; min-width: 0; }

  .fact-row button {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
  }

  .link-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    padding: 8px 0;
    font-size: 0.95rem;
  }

  .actions {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }

  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink-soft);
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 1rem;
    cursor: pointer;
  }

  #result { display: none; }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(42, 38, 50, 0.15);
  }

  .card-photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--paper-alt);
    display: block;
  }

  .card-photo-placeholder {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--paper-alt);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 3rem;
  }

  .card-body {
    padding: 24px 28px 28px;
    font-family: var(--card-body-font, inherit);
  }

  .card-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 6px;
  }

  .card-name {
    font-family: var(--card-heading-font, Georgia, "Palatino Linotype", "Book Antiqua", serif);
    color: var(--ink);
    font-size: 1.8rem;
    margin: 0 0 6px;
  }

  .card-nicknames {
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 14px;
  }

  .card-personality {
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .card-facts {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }

  .card-facts li {
    background: var(--paper);
    border-radius: 10px;
    padding: 12px 14px;
    line-height: 1.4;
  }

  .card-facts li::before {
    content: "🐾 ";
  }

  @media (max-width: 420px) {
    .wrap { padding: 16px 14px 60px; }
    .panel { padding: 20px 16px; }
    header.top h1 { font-size: 1.6rem; }
    .card-body { padding: 18px 18px 22px; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
  }

  @media print {
    .back-link, header.top, #form-section, #style-section, .actions {
      display: none !important;
    }
    body { background: #fff !important; }
    .wrap { padding: 0; max-width: 100%; }
    #result { display: block !important; }
    .card { box-shadow: none; max-width: 420px; margin: 20px auto; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="index.html">← на главную</a>

    <header class="top">
      <h1>PetPersona</h1>
      <p>Заполни анкету о своём питомце — получишь готовую карточку-персону, которую можно скачать и показать всем.</p>
    </header>

    <section id="style-section" class="panel style-panel">
      <div class="style-group">
        <label>Цвет акцента</label>
        <div class="swatch-row" id="color-swatches">
          <button type="button" class="swatch swatch-auto selected" data-color="auto" title="На вкус самого умного ИИ-агента">✨</button>
          <button type="button" class="swatch" data-color="rose" style="background:#c9738a" title="Розовый"></button>
          <button type="button" class="swatch" data-color="teal" style="background:#4a9d95" title="Бирюзовый"></button>
          <button type="button" class="swatch" data-color="amber" style="background:#d99a3d" title="Янтарный"></button>
          <button type="button" class="swatch" data-color="indigo" style="background:#6c6bb0" title="Индиго"></button>
          <button type="button" class="swatch" data-color="forest" style="background:#5f8a5a" title="Зелёный"></button>
          <button type="button" class="swatch" data-color="graphite" style="background:#5c6470" title="Графит"></button>
          <button type="button" class="swatch" data-color="navy" style="background:#3d5a73" title="Тёмно-синий"></button>
        </div>
      </div>

      <div class="style-group">
        <label>Фон карточки</label>
        <div class="swatch-row" id="pattern-swatches">
          <button type="button" class="pattern-swatch pattern-swatch-auto selected" data-pattern="auto" title="На вкус самого умного ИИ-агента">✨</button>
          <button type="button" class="pattern-swatch" data-pattern="cat" title="Кошачьи лапки"></button>
          <button type="button" class="pattern-swatch" data-pattern="dog" title="Собачьи лапки"></button>
          <button type="button" class="pattern-swatch" data-pattern="hearts" title="Сердечки"></button>
          <button type="button" class="pattern-swatch" data-pattern="stars" title="Звёзды"></button>
          <button type="button" class="pattern-swatch" data-pattern="bones" title="Косточки"></button>
          <button type="button" class="pattern-swatch" data-pattern="none" style="background:#fff" title="Без узора"></button>
        </div>
      </div>

      <div class="style-group">
        <label for="font-select">Шрифт</label>
        <select id="font-select">
          <option value="auto" selected>На вкус самого умного ИИ-агента</option>
          <option value="classic">Классика (с засечками)</option>
          <option value="playful">Игривый</option>
          <option value="modern">Современный</option>
          <option value="bold">Строгий гротеск</option>
          <option value="handwritten">Рукописный</option>
        </select>
      </div>
    </section>

    <section id="form-section" class="panel">
      <form id="pet-form">
        <label for="pet-name">Имя питомца *</label>
        <input type="text" id="pet-name" required maxlength="60">

        <label for="pet-species">Вид животного</label>
        <select id="pet-species">
          <option value="кот">Кот / кошка</option>
          <option value="собака">Собака</option>
          <option value="другое">Другое</option>
        </select>

        <label for="pet-breed">Порода</label>
        <input type="text" id="pet-breed" maxlength="80">

        <label for="pet-nicknames">Прозвища (через запятую)</label>
        <input type="text" id="pet-nicknames" maxlength="120">

        <label for="pet-personality">Характер</label>
        <textarea id="pet-personality" maxlength="300" placeholder="Пара фраз о характере"></textarea>

        <label>Факты о питомце</label>
        <div id="facts-list">
          <div class="fact-row">
            <input type="text" class="fact-input" maxlength="140" placeholder="Например: любит пить воду из-под крана">
          </div>
          <div class="fact-row">
            <input type="text" class="fact-input" maxlength="140" placeholder="Ещё один факт">
          </div>
        </div>
        <div class="link-row">
          <button type="button" id="add-fact" class="link-btn">+ добавить факт</button>
          <button type="button" id="suggest-fact" class="link-btn">💡 Подскажи факт</button>
        </div>

        <label for="pet-photo">Фото питомца</label>
        <input type="file" id="pet-photo" accept="image/*">

        <div class="actions">
          <button type="submit" class="primary">Создать карточку</button>
        </div>
      </form>
    </section>

    <section id="result">
      <div class="card" id="card-preview"></div>
      <div class="actions">
        <button type="button" id="download-btn" class="primary">Скачать как HTML</button>
        <button type="button" id="share-btn" class="secondary">Поделиться</button>
        <button type="button" id="print-btn" class="secondary">Распечатать</button>
        <button type="button" id="edit-btn" class="secondary">Изменить анкету</button>
      </div>
    </section>
  </div>

<script>
  const MAX_FACTS = 4;
  const factsList = document.getElementById('facts-list');
  const addFactBtn = document.getElementById('add-fact');
  const suggestFactBtn = document.getElementById('suggest-fact');
  const form = document.getElementById('pet-form');
  const styleSection = document.getElementById('style-section');
  const formSection = document.getElementById('form-section');
  const resultSection = document.getElementById('result');
  const cardPreview = document.getElementById('card-preview');
  const downloadBtn = document.getElementById('download-btn');
  const shareBtn = document.getElementById('share-btn');
  const printBtn = document.getElementById('print-btn');
  const editBtn = document.getElementById('edit-btn');
  const photoInput = document.getElementById('pet-photo');
  const fontSelect = document.getElementById('font-select');

  let photoDataUrl = null;
  let selectedColor = 'auto';
  let selectedPattern = 'auto';

  const THEME_COLORS = [
    { key: 'rose', accent: '#c9738a', light: '#e3a6b6' },
    { key: 'teal', accent: '#4a9d95', light: '#7cc2bb' },
    { key: 'amber', accent: '#d99a3d', light: '#eab868' },
    { key: 'indigo', accent: '#6c6bb0', light: '#9695ce' },
    { key: 'forest', accent: '#5f8a5a', light: '#8bb586' },
    { key: 'graphite', accent: '#5c6470', light: '#8b929c' },
    { key: 'navy', accent: '#3d5a73', light: '#6d8aa0' }
  ];

  const THEME_FONTS = [
    { key: 'classic', heading: 'Georgia, "Palatino Linotype", "Book Antiqua", serif', body: 'inherit' },
    { key: 'playful', heading: '"Comic Sans MS", "Segoe Print", cursive', body: '"Comic Sans MS", "Segoe Print", cursive' },
    { key: 'modern', heading: '"Trebuchet MS", Verdana, sans-serif', body: '"Trebuchet MS", Verdana, sans-serif' },
    { key: 'bold', heading: 'Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif', body: '"Arial Narrow", Arial, sans-serif' },
    { key: 'handwritten', heading: '"Brush Script MT", "Segoe Script", cursive', body: '"Segoe Print", "Comic Sans MS", cursive' }
  ];

  const AUTO_BY_SPECIES = {
    'кот': { color: 'rose', font: 'classic', pattern: 'cat' },
    'собака': { color: 'amber', font: 'playful', pattern: 'dog' },
    'другое': { color: 'teal', font: 'modern', pattern: 'hearts' }
  };

  const FACT_SUGGESTIONS = {
    'кот': [
      'Пьёт исключительно из-под крана — вода в миске невкусная',
      'Спит по 18 часов в сутки и считает это подвигом',
      'Требует открыть дверь, даже если она уже открыта',
      'Устраивает «динамическую смену интерьера» по ночам',
      'Смотрит в одну точку и этим пугает всех вокруг',
      'Садится ровно на клавиатуру, когда нужно работать',
      'Приносит в зубах предметы, которые никто не просил',
      'Считает коробку любого размера своим законным домом',
      'Будит в 5 утра, потому что миска опустела на треть',
      'Обожает наблюдать за птицами через окно часами',
      'Игнорирует новую игрушку, но обожает обёртку от неё'
    ],
    'собака': [
      'Гоняется за собственным хвостом по расписанию',
      'Считает почтальона личным врагом',
      'Может спать в любой позе, кроме удобной для хозяина',
      'Обожает воровать носки и прятать их под диваном',
      'Устраивает «салют» из шерсти два раза в год',
      'Уверен, что каждый мяч на улице принадлежит ему',
      'Встречает у двери так, будто не виделись год',
      'Точно знает время прогулки лучше любых часов',
      'Разговаривает с каждой собакой на видео в телефоне',
      'Уверенно охраняет дом от проезжающих машин'
    ],
    'другое': [
      'Узнаёт звук холодильника из трёх комнат',
      'Обожает исследовать новые коробки',
      'Считает будильник личным врагом',
      'Готов часами наблюдать за окном',
      'Требует внимания ровно тогда, когда ты занят',
      'Устраивает истерику по расписанию, известному только ему',
      'Обожает всё новое ровно один день, а потом игнорирует',
      'Устраивает генеральную уборку своей территории по-своему',
      'Изобретает себе занятие из любого случайного предмета',
      'Делает вид, что спит, но на самом деле всё слышит'
    ]
  };

  function pawPatternDataUri(shape, color) {
    if (shape === 'none') return null;
    let inner = '';
    if (shape === 'cat') {
      inner = `<g transform='translate(55,55) rotate(18)' fill='${color}'><ellipse cx='0' cy='11' rx='14' ry='11'/><circle cx='-15' cy='-9' r='6.5'/><circle cx='-5' cy='-18' r='6.5'/><circle cx='5' cy='-18' r='6.5'/><circle cx='15' cy='-9' r='6.5'/></g>`;
    } else if (shape === 'dog') {
      inner = `<g transform='translate(55,55) rotate(-12)' fill='${color}'><ellipse cx='0' cy='14' rx='16' ry='10'/><ellipse cx='-16' cy='-6' rx='7' ry='9'/><ellipse cx='-6' cy='-17' rx='7' ry='9'/><ellipse cx='6' cy='-17' rx='7' ry='9'/><ellipse cx='16' cy='-6' rx='7' ry='9'/></g>`;
    } else if (shape === 'hearts') {
      inner = `<g transform='translate(55,55)' fill='${color}'><path d='M0,-6 C-10,-18 -26,-6 0,14 C26,-6 10,-18 0,-6 Z'/></g>`;
    } else if (shape === 'stars') {
      inner = `<g transform='translate(55,55) rotate(10)' fill='${color}'><path d='M0,-20 L5,-5 L20,0 L5,5 L0,20 L-5,5 L-20,0 L-5,-5 Z'/></g>`;
    } else if (shape === 'bones') {
      inner = `<g transform='translate(55,55) rotate(-20)' fill='${color}'><rect x='-20' y='-4' width='40' height='8' rx='4'/><circle cx='-20' cy='-6' r='6'/><circle cx='-20' cy='6' r='6'/><circle cx='20' cy='-6' r='6'/><circle cx='20' cy='6' r='6'/></g>`;
    }
    return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110'>${inner}</svg>")`;
  }

  document.querySelectorAll('.pattern-swatch[data-pattern]').forEach((btn) => {
    const shape = btn.dataset.pattern;
    if (shape !== 'auto' && shape !== 'none') {
      const uri = pawPatternDataUri(shape, 'rgba(42,38,50,0.45)');
      btn.style.backgroundImage = uri;
      btn.style.backgroundRepeat = 'repeat';
    }
  });

  document.getElementById('color-swatches').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-color]');
    if (!btn) return;
    selectedColor = btn.dataset.color;
    document.querySelectorAll('#color-swatches .swatch').forEach((b) => b.classList.toggle('selected', b === btn));
  });

  document.getElementById('pattern-swatches').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-pattern]');
    if (!btn) return;
    selectedPattern = btn.dataset.pattern;
    document.querySelectorAll('#pattern-swatches .pattern-swatch').forEach((b) => b.classList.toggle('selected', b === btn));
  });

  function resolveTheme(speciesValue) {
    const auto = AUTO_BY_SPECIES[speciesValue] || AUTO_BY_SPECIES['другое'];
    const colorKey = selectedColor === 'auto' ? auto.color : selectedColor;
    const patternKey = selectedPattern === 'auto' ? auto.pattern : selectedPattern;
    const fontKey = fontSelect.value === 'auto' ? auto.font : fontSelect.value;

    const color = THEME_COLORS.find((c) => c.key === colorKey) || THEME_COLORS[0];
    const font = THEME_FONTS.find((f) => f.key === fontKey) || THEME_FONTS[0];

    return {
      accent: color.accent,
      accentLight: color.light,
      headingFont: font.heading,
      bodyFont: font.body,
      patternCss: pawPatternDataUri(patternKey, 'rgba(42,38,50,0.05)')
    };
  }

  function addFactRow() {
    if (factsList.querySelectorAll('.fact-row').length >= MAX_FACTS) return;
    const row = document.createElement('div');
    row.className = 'fact-row';
    row.innerHTML = '<input type="text" class="fact-input" maxlength="140" placeholder="Ещё один факт">' +
      '<button type="button" title="Удалить">×</button>';
    row.querySelector('button').addEventListener('click', () => row.remove());
    factsList.appendChild(row);
  }

  addFactBtn.addEventListener('click', addFactRow);

  suggestFactBtn.addEventListener('click', () => {
    const species = document.getElementById('pet-species').value;
    const bank = FACT_SUGGESTIONS[species] || FACT_SUGGESTIONS['другое'];
    let inputs = Array.from(document.querySelectorAll('.fact-input'));
    const used = new Set(inputs.map((i) => i.value.trim()).filter(Boolean));
    const available = bank.filter((f) => !used.has(f));
    const pool = available.length ? available : bank;
    const pick = pool[Math.floor(Math.random() * pool.length)];

    let target = inputs.find((i) => !i.value.trim());
    if (!target) {
      if (inputs.length < MAX_FACTS) {
        addFactRow();
        inputs = Array.from(document.querySelectorAll('.fact-input'));
        target = inputs[inputs.length - 1];
      } else {
        target = inputs[inputs.length - 1];
      }
    }
    target.value = pick;
  });

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) { photoDataUrl = null; return; }
    const reader = new FileReader();
    reader.onload = (e) => { photoDataUrl = e.target.result; };
    reader.readAsDataURL(file);
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function buildCardHtml(data) {
    const photoBlock = data.photo
      ? `<img class="card-photo" src="${data.photo}" alt="${escapeHtml(data.name)}">`
      : `<div class="card-photo-placeholder">🐾</div>`;

    const nicknamesBlock = data.nicknames
      ? `<p class="card-nicknames">${escapeHtml(data.nicknames)}</p>`
      : '';

    const personalityBlock = data.personality
      ? `<p class="card-personality">${escapeHtml(data.personality)}</p>`
      : '';

    const factsBlock = data.facts.length
      ? `<ul class="card-facts">${data.facts.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>`
      : '';

    return `${photoBlock}
      <div class="card-body">
        <p class="card-eyebrow">${escapeHtml(data.species)}${data.breed ? ' · ' + escapeHtml(data.breed) : ''}</p>
        <h2 class="card-name">${escapeHtml(data.name)}</h2>
        ${nicknamesBlock}
        ${personalityBlock}
        ${factsBlock}
      </div>`;
  }

  function collectData() {
    const facts = Array.from(document.querySelectorAll('.fact-input'))
      .map(i => i.value.trim())
      .filter(Boolean);

    return {
      name: document.getElementById('pet-name').value.trim(),
      species: document.getElementById('pet-species').selectedOptions[0].textContent,
      breed: document.getElementById('pet-breed').value.trim(),
      nicknames: document.getElementById('pet-nicknames').value.trim(),
      personality: document.getElementById('pet-personality').value.trim(),
      facts: facts,
      photo: photoDataUrl
    };
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = collectData();
    const theme = resolveTheme(document.getElementById('pet-species').value);

    cardPreview.innerHTML = buildCardHtml(data);
    cardPreview.style.setProperty('--accent', theme.accent);
    cardPreview.style.setProperty('--accent-light', theme.accentLight);
    cardPreview.style.setProperty('--card-heading-font', theme.headingFont);
    cardPreview.style.setProperty('--card-body-font', theme.bodyFont);

    document.body.style.backgroundImage = theme.patternCss || 'none';

    styleSection.style.display = 'none';
    formSection.style.display = 'none';
    resultSection.style.display = 'block';
  });

  editBtn.addEventListener('click', () => {
    resultSection.style.display = 'none';
    styleSection.style.display = 'block';
    formSection.style.display = 'block';
  });

  function buildStandaloneHtml(name) {
    const styles = document.querySelector('style').outerHTML;
    const bg = document.body.style.backgroundImage;
    const bodyStyle = (bg && bg !== 'none')
      ? ` style="background-image:${bg.replace(/"/g, '&quot;')}; background-repeat:repeat;"`
      : '';
    return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(name)} — карточка питомца</title>
${styles}
</head>
<body${bodyStyle}>
  <div class="wrap">
    ${cardPreview.outerHTML}
  </div>
</body>
</html>`;
  }

  downloadBtn.addEventListener('click', () => {
    const name = document.getElementById('pet-name').value.trim() || 'Питомец';
    const html = buildStandaloneHtml(name);
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name.replace(/[^a-zA-Zа-яА-ЯёЁ0-9]+/g, '_') + '_persona.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  shareBtn.addEventListener('click', async () => {
    const name = document.getElementById('pet-name').value.trim() || 'Питомец';
    const html = buildStandaloneHtml(name);
    const filename = name.replace(/[^a-zA-Zа-яА-ЯёЁ0-9]+/g, '_') + '_persona.html';

    try {
      const file = new File([html], filename, { type: 'text/html' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: `Карточка: ${name}`, text: 'Смотри, какая карточка получилась в PetPersona!' });
        return;
      }
      if (navigator.share) {
        await navigator.share({ title: `Карточка: ${name}`, text: 'Я создал карточку своего питомца в PetPersona!' });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
    alert('Твой браузер не поддерживает системный шеринг. Используй кнопку «Скачать как HTML» и отправь файл вручную.');
  });

  printBtn.addEventListener('click', () => window.print());
</script>
</body>
</html>
